[package]
name = "vetis-static"
version = "0.1.1-beta.3"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-static"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Static Files support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.86.0"

[lints.cargo]
unused_dependencies = "deny"

[package.metadata.cargo-machete]
ignored = ["cel"]

[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:tokio"]

[dependencies]
cel = "0.16.0"
http = "1.5.0"
hyper-body-utils = "0.1.18"
minimime = "1.0.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive", "rc"] }
time = "0.3.55"
tokio = { version = "1.54.1", optional = true }
typetag = "0.2.21"
vetis = { path = "../vetis/vetis" }

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5-beta.3" }
deboa-tokio = { version = "0.1.4-beta.3", default-features = false, features = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros"] }
vetis-log = { path = "../vetis-log" }
vetis-macros = { path = "../vetis/vetis-macros" }
vetis-matchers = { path = "../vetis-matchers" }
vetis-tokio = { path = "../vetis-tokio" }

